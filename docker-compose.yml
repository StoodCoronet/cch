services:
  cch-server:
    image: ghcr.io/stoodcoronet/cch-server:latest
    restart: unless-stopped
    # Not published to the host — only reachable through the caddy service.
    expose:
      - "3005"
    environment:
      - HANDY_MASTER_SECRET=${HANDY_MASTER_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PORT=3005
      - PUBLIC_URL=${PUBLIC_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - cch-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./server/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - cch-server

volumes:
  cch-data:
  caddy-data:
  caddy-config:
